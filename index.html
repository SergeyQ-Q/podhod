<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подход — журнал тренировок</title>
<meta name="theme-color" content="#0D1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Подход">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-column phone app — sticky top bar, scrolling content, fixed tab bar; bumper-plate colours mark set types */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#E3E8EF; --line:#D2D9E2;
  --fg:#11161D; --muted:#5B6676; --accent:#1F55D6; --accent-ink:#FFFFFF; --accent-soft:#DCE6FB;
  --ok:#17803D; --ok-soft:#DCF2E3; --warm:#B7791F; --warm-soft:#FBEFD6; --bad:#C0262D; --bad-soft:#FBE0E1; --drop:#7A3FD1; --drop-soft:#ECE2FB;
  --shadow:0 1px 2px rgba(17,22,29,.06),0 4px 14px rgba(17,22,29,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tab-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#161B22; --surface-2:#1F262F; --line:#2B333E;
  --fg:#E8ECF1; --muted:#8C97A6; --accent:#5B8CFF; --accent-ink:#0B1020; --accent-soft:#1B2A4D;
  --ok:#3DBB66; --ok-soft:#14301F; --warm:#E2A73E; --warm-soft:#33280F; --bad:#F0565C; --bad-soft:#3A1719; --drop:#A879F5; --drop-soft:#2A1C45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161B22; --surface-2:#1F262F; --line:#2B333E;
  --fg:#E8ECF1; --muted:#8C97A6; --accent:#5B8CFF; --accent-ink:#0B1020; --accent-soft:#1B2A4D;
  --ok:#3DBB66; --ok-soft:#14301F; --warm:#E2A73E; --warm-soft:#33280F; --bad:#F0565C; --bad-soft:#3A1719; --drop:#A879F5; --drop-soft:#2A1C45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:8px}
.brand{font:700 26px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.plate{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 7px var(--bg);flex:none}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:22px;height:22px}

main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 90px)}
main .wrap{display:flex;flex-direction:column;gap:20px;padding-block:8px 24px}

h1,h2,h3{margin:0;text-wrap:balance}
.display{font:700 40px/1 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
h2{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;background:var(--surface-2);color:var(--fg)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* start hero */
.start{display:flex;flex-direction:column;gap:14px}
.weekline{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekline div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.weekline i{width:100%;max-width:40px;height:8px;border-radius:4px;background:var(--surface-2)}
.weekline .on i{background:var(--accent)}
.weekline .today{color:var(--fg);font-weight:700}

.routine h3{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.coachplan{border-color:var(--accent)}
.routine p{margin:6px 0 12px;color:var(--muted);font-size:14px}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:40ch}

/* active workout */
.aw-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.aw-name{width:100%;border:0;background:transparent;font:700 26px/1.1 var(--f-display);text-transform:uppercase;padding:2px 0;border-bottom:1.5px dashed transparent}
.aw-name:focus{outline:none;border-bottom-color:var(--accent)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.ex-h{display:flex;align-items:flex-start;gap:8px}
.ex-h .t{flex:1;min-width:0;text-align:left}
.ex-h .t b{display:block;font:700 19px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--accent)}
.ex-h .t span{font-size:12px;color:var(--muted)}
.ex-note{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;resize:vertical;min-height:38px;font-size:14px}
.chip-btn{align-self:flex-start;font-size:13px;color:var(--accent);font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:4px 0}
.sets{width:100%;border-collapse:separate;border-spacing:0 4px}
.sets th{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 2px}
.sets td{text-align:center;padding:0 2px;vertical-align:middle}
.sets tr.done td{background:var(--ok-soft)}
.sets tr.done td:first-child{border-radius:8px 0 0 8px}
.sets tr.done td:last-child{border-radius:0 8px 8px 0}
.setlbl{width:34px;height:34px;border-radius:8px;font:700 16px/1 var(--f-display);background:var(--surface-2)}
.setlbl.t-w{background:var(--warm-soft);color:var(--warm)}
.setlbl.t-d{background:var(--drop-soft);color:var(--drop)}
.setlbl.t-f{background:var(--bad-soft);color:var(--bad)}
.prev{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:54px}
.prev button{color:inherit;padding:6px 2px}
.cell{width:100%;max-width:84px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.cell::placeholder{color:var(--muted);opacity:.6;font-weight:500}
tr.done .cell{background:transparent;border-color:transparent}
.chk{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:18px;height:18px}
tr.done .chk{background:var(--ok);color:#fff}
.addset{width:100%;min-height:36px;border-radius:8px;background:var(--surface-2);font-weight:600;font-size:14px}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:6;padding:8px 0}
.rest .wrap{display:flex}
.rest-in{flex:1;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.rest-in .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .25s linear}
.rest-in b{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:66px}
.rest-in .lab{font-size:12px;opacity:.75;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-in button{min-height:36px;padding:0 10px;border-radius:8px;background:rgba(127,127,127,.25);font-weight:600;font-size:14px}

/* active pill on other tabs */
.live{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:6;padding:8px 0}
.live button{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.2)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* lists */
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.exrow .ava{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:700 15px/1 var(--f-display);color:var(--muted);flex:none;text-transform:uppercase}
.exrow.sel .ava{background:var(--accent);color:var(--accent-ink)}
.exrow .t{flex:1;min-width:0}
.exrow .t b{display:block;font-weight:600}
.exrow .t span{font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.pr{background:var(--warm-soft);color:var(--warm)}

.hist h3{font:700 20px/1.1 var(--f-display);text-transform:uppercase}
.hist .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0 10px}
.hist .meta b{color:var(--fg);font-variant-numeric:tabular-nums}
.hist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.hist li{display:flex;gap:8px}
.hist li .n{color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums}
.month{margin-top:6px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font:700 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.hbar{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.hbar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.hbar .tr{background:var(--surface-2);border-radius:5px}
.hbar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto}
.heat i{width:100%;min-width:14px;aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.heat i.on{background:var(--accent)}
.heat i.fut{background:transparent}

table.detail{width:100%;border-collapse:collapse;font-size:14px}
table.detail td{padding:5px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.detail td:first-child{width:36px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .18s ease-out}
.sheet-h{flex:none;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-h .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.sheet-h h2{flex:1;min-width:0;text-align:center;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h .btn{flex:none}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-b .wrap{display:flex;flex-direction:column;gap:16px;padding-block:16px calc(32px + env(safe-area-inset-bottom,0px))}
.pop{position:fixed;inset:0;z-index:30;background:rgba(8,10,14,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.pop-in{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;animation:up .18s ease-out}
.pop-in h3{font:700 20px/1.15 var(--f-display);text-transform:uppercase;margin-bottom:4px}
.pop-in p{margin:0 0 6px;color:var(--muted)}
.pop-in .opt{text-align:left;padding:12px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center}
.pop-in .opt:hover{background:var(--surface-2)}
.pop-in .opt.danger{color:var(--bad)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet,.pop,.pop-in{animation:none}.rest-in .bar{transition:none}}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,.select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px}
textarea.input{height:auto;min-height:120px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,monospace}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:34px;height:34px;font-weight:700;font-size:18px;background:var(--surface-2)}
.stepper span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ritem{display:flex;flex-direction:column;gap:10px}
.tgt{display:flex;gap:14px;flex-wrap:wrap}
.tgt label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tgt .cell{width:72px}
.input.sm{height:38px;font-size:14px}
.ritem .row{gap:8px}
.mini{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.mini svg{width:16px;height:16px}
.mini:disabled{opacity:.35}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);animation:fade .15s}
.banner{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.pr-list{display:flex;flex-direction:column;gap:6px}
.pr-list div{display:flex;gap:8px;align-items:center;font-size:14px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.syncdot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block;opacity:.6}
.syncdot[data-s="ok"]{background:var(--ok);opacity:1}
.syncdot[data-s="saving"],.syncdot[data-s="pending"],.syncdot[data-s="offline"]{background:var(--warm);opacity:1}
.syncdot[data-s="error"]{background:var(--bad);opacity:1}
.syncdot.big{width:14px;height:14px}
.iconbtn{position:relative}
.iconbtn .syncdot{position:absolute;top:7px;right:6px;border:2px solid var(--bg);width:11px;height:11px;box-sizing:content-box}
</style>
</head>
<body>

<header class="top" id="top"><div class="wrap">
  <div class="brand"><span class="plate" aria-hidden="true"></span><span>Подход</span></div>
  <button class="iconbtn" data-act="settings" aria-label="Настройки"><span class="syncdot" id="syncdot" data-s="off"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div></header>

<main id="main"><div class="wrap"><div class="loading">Загружаю журнал…</div></div></main>
<div id="float"></div>
<nav class="tabs" id="tabs"><div class="wrap">

/* ---------- state & storage: local cache + Supabase sync ---------- */
const S={mode:"loading",workouts:[],routines:[],custom:[],active:null,settings:{rest:90},tab:"workout",exFilter:{q:"",m:""},progMetric:"count",note:"",coach:[],coachLink:undefined,coachErr:"",sync:{status:"off",last:0,err:""}};
const LS_KEY="podhod:v1",LS_Q="podhod:queue",LS_SYNCED="podhod:synced-user",TABLE="podhod_docs";
const COLL={workouts:"workouts",routines:"routines",custom:"exercises"};
const KEY_BY_COLL={workouts:"workouts",routines:"routines",exercises:"custom"};
let sb=null,session=null,queue=[];
const COACH=new URLSearchParams(location.search).get("coach");
const APP_VERSION="6";
async function checkUpdate(){try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.json()).v;const busy=document.activeElement&&document.activeElement.matches("input,textarea,select");if(v&&String(v)!==APP_VERSION&&!busy&&!document.querySelector(".sheet,.pop"))location.reload()}catch(e){}}
function sortData(){S.workouts.sort((a,b)=>b.start-a.start);S.routines.sort((a,b)=>(a.created||0)-(b.created||0));S.custom.sort((a,b)=>a.name.localeCompare(b.name,"ru"))}
function lsSave(){if(COACH)return;try{localStorage.setItem(LS_KEY,JSON.stringify({workouts:S.workouts,routines:S.routines,custom:S.custom,active:S.active,settings:S.settings,coach:S.coach}))}catch(e){}}
function lsLoad(){let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){}
  if(d){S.workouts=d.workouts||[];S.routines=d.routines||[];S.custom=d.custom||[];S.active=d.active||null;S.settings={rest:90,...(d.settings||{})};S.coach=d.coach||[]}
  try{queue=JSON.parse(localStorage.getItem(LS_Q)||"[]")}catch(e){queue=[]}sortData()}
function qSave(){try{localStorage.setItem(LS_Q,JSON.stringify(queue))}catch(e){}}
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function enqueue(op,coll,id,data){
  if(COACH||!sb||!session)return;
  queue=queue.filter(q=>!(q.coll===coll&&q.id===id));queue.push({op,coll,id,data:clone(data)});qSave();flush();
}
async function put(key,obj){
  const arr=S[key];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);sortData();lsSave();
  enqueue("put",COLL[key],obj.id,obj);
}
async function del(key,id){S[key]=S[key].filter(x=>x.id!==id);lsSave();enqueue("del",COLL[key],id)}
let actTimer=null;
function saveActive(now){lsSave();clearTimeout(actTimer);actTimer=setTimeout(()=>S.active?enqueue("put","state","active",{w:S.active}):enqueue("del","state","active"),now?0:1500)}
async function saveSettings(){lsSave();enqueue("put","state","settings",S.settings)}

function setSync(st){S.sync.status=st;renderSync()}
function renderSync(){
  const d=$("#syncdot");if(!d)return;
  let st=S.sync.status;if(sb&&session&&queue.length&&st==="ok")st="pending";
  d.dataset.s=st;
  d.title={off:"Облако не настроено",signedout:"Не выполнен вход",ok:"Синхронизировано",saving:"Синхронизация…",pending:"Есть неотправленные изменения",offline:"Нет сети — изменения отправятся позже",error:"Ошибка синхронизации"}[st]||"";
  const t=$("#sync-text");if(t)t.textContent=syncText();
}
function syncText(){
  const s=S.sync.status;
  if(s==="error")return"Ошибка: "+S.sync.err;
  if(s==="offline")return`Нет сети. Не отправлено изменений: ${queue.length}.`;
  if(s==="saving")return"Синхронизация…";
  if(queue.length)return`Не отправлено изменений: ${queue.length}.`;
  return S.sync.last?"Всё сохранено в облаке · "+new Date(S.sync.last).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):"Всё сохранено в облаке";
}
let flushing=false;
async function flush(){
  if(flushing||!sb||!session)return;
  if(!queue.length){if(S.sync.status!=="error")setSync("ok");return}
  if(navigator.onLine===false){setSync("offline");return}
  flushing=true;setSync("saving");
  try{
    while(queue.length){
      const q=queue[0];
      const res=q.op==="put"
        ?await sb.from(TABLE).upsert({user_id:session.user.id,coll:q.coll,id:q.id,data:q.data,updated_at:new Date().toISOString()})
        :await sb.from(TABLE).delete().match({user_id:session.user.id,coll:q.coll,id:q.id});
      if(res.error)throw res.error;
      queue=queue.filter(x=>x!==q);qSave();
    }
    S.sync.last=Date.now();S.sync.err="";flushing=false;setSync("ok");
  }catch(e){flushing=false;S.sync.err=(e&&e.message)||String(e);setSync(navigator.onLine===false?"offline":"error")}
}
let pulling=false,lastPull=0;
async function pull(){
  if(!sb||!session||pulling)return;pulling=true;lastPull=Date.now();setSync("saving");
  try{
    const rows=[];
    for(let from=0;;from+=1000){const{data,error}=await sb.from(TABLE).select("coll,id,data").range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break}
    const uid=session.user.id;let first=false;try{first=localStorage.getItem(LS_SYNCED)!==uid}catch(e){first=true}
    const remote={workouts:new Map(),routines:new Map(),custom:new Map()};let rActive,rSettings;
    for(const r of rows){if(r.coll==="state"){if(r.id==="active")rActive=r.data&&r.data.w||null;else if(r.id==="settings")rSettings=r.data}else{const k=KEY_BY_COLL[r.coll];if(k)remote[k].set(r.id,{...r.data,id:r.id})}}
    const pend=new Map(queue.map(q=>[q.coll+"/"+q.id,q]));
    for(const k of["workouts","routines","custom"]){
      const merged=new Map(remote[k]);
      for(const x of S[k]){const p=pend.get(COLL[k]+"/"+x.id);if(p)continue;if(first&&!merged.has(x.id)){merged.set(x.id,x);queue.push({op:"put",coll:COLL[k],id:x.id,data:clone(x)})}}
      for(const[key,p]of pend){const[c,id]=key.split("/");if(c!==COLL[k])continue;if(p.op==="put")merged.set(id,{...p.data,id});else merged.delete(id)}
      S[k]=[...merged.values()];
    }
    const prevActive=JSON.stringify(S.active);
    if(!pend.has("state/active")){if(rActive!==undefined)S.active=rActive;else if(first&&S.active)queue.push({op:"put",coll:"state",id:"active",data:{w:clone(S.active)}});else S.active=null}
    if(!pend.has("state/settings")){if(rSettings)S.settings={rest:90,...rSettings};else if(first)queue.push({op:"put",coll:"state",id:"settings",data:clone(S.settings)})}
    qSave();sortData();lsSave();try{localStorage.setItem(LS_SYNCED,uid)}catch(e){}
    S.sync.last=Date.now();S.sync.err="";pulling=false;setSync("ok");loadCoach();
    if(JSON.stringify(S.active)!==prevActive){if(S.active)wake(true);render()}else softRender();
    flush();
  }catch(e){pulling=false;S.sync.err=(e&&e.message)||String(e);setSync(navigator.onLine===false?"offline":"error")}
}
function setNote(){
  S.note=!sb?"Облако не настроено: данные хранятся только в этом браузере. Делайте резервную копию в настройках."
    :!session?"Войдите в настройках (шестерёнка), чтобы тренировки сохранялись в облаке и были видны на всех устройствах.":"";
}
async function init(){
  if(!COACH)lsLoad();S.mode="ready";
  const cfg=window.PODHOD_CONFIG||{};
  if(cfg.url&&cfg.anonKey&&window.supabase&&window.supabase.createClient){
    try{
      sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const{data}=await sb.auth.getSession();session=data.session;
      sb.auth.onAuthStateChange((ev,s)=>{const was=session;session=s;setNote();if(s&&!was){pull()}if(!s)setSync("signedout");renderSync()});
    }catch(e){sb=null}
  }
  if(COACH){startCoach();return}
  setNote();if(S.active)wake(true);render();setTimeout(checkUpdate,2500);
  if(!sb)setSync("off");else if(!session)setSync("signedout");else pull();
  addEventListener("online",()=>{flush();pull()});
  addEventListener("offline",()=>{if(sb&&session)setSync("offline")});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;checkUpdate();if(Date.now()-lastPull>30000)pull()});
  setInterval(flush,30000);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

/* ---------- trainer link ---------- */
const CO={state:"loading",client:"",plans:[],err:""};
function planLine(it){const x=exInfo(it);let t=x.name+" "+(it.sets||"")+"×"+(it.r!=null?(x.type==="time"?it.r+"с":it.r):"…");if(it.w!=null)t+=" · "+fmtN(it.w)+" кг";return t}
async function startCoach(){
  render();
  if(!sb){CO.state="error";CO.err="Облако не настроено (config.js).";render();return}
  try{const info=await sb.rpc("podhod_coach_info",{p_token:COACH});if(info.error)throw info.error;
    if(!info.data){CO.state="invalid";render();return}
    CO.client=info.data.client||"";await coachReload();CO.state="ready"}
  catch(e){CO.state=/uuid/i.test(String(e&&e.message))?"invalid":"error";CO.err=(e&&e.message)||String(e)}
  render();
}
async function coachReload(){const r=await sb.rpc("podhod_coach_list",{p_token:COACH});if(r.error)throw r.error;CO.plans=(r.data||[]).map(x=>({...x.data,id:x.id})).sort((a,b)=>(a.created||0)-(b.created||0))}
async function coachSave(d){
  const r=await sb.rpc("podhod_coach_save",{p_token:COACH,p_id:d.id,p_data:JSON.parse(JSON.stringify({...d,updated:Date.now()}))});
  if(r.error){toast("Не сохранилось: "+r.error.message);return}
  try{await coachReload()}catch(e){}toast("План сохранён — клиент увидит его в приложении");render();
}
async function coachDelete(d){const r=await sb.rpc("podhod_coach_delete",{p_token:COACH,p_id:d.id});if(r.error){toast("Не удалилось: "+r.error.message);return}try{await coachReload()}catch(e){}render()}
function viewCoach(){
  if(CO.state==="loading")return'<div class="loading">Открываю кабинет тренера…</div>';

/* ---------- exercise lookup & stats ---------- */
function allExercises(){const ov=new Map(S.custom.filter(c=>c.id.startsWith("b:")).map(c=>[c.id,c]));return[...BUILTIN.map(b=>ov.has(b.id)?{...b,name:ov.get(b.id).name,renamed:true}:b),...S.custom.filter(c=>!c.id.startsWith("b:")).map(c=>({...c,builtin:false}))]}
function exById(id){const b=BUILTIN_MAP.get(id);if(b){const o=S.custom.find(c=>c.id===id);return o?{...b,name:o.name,renamed:true}:b}return S.custom.find(c=>c.id===id)||null}
function nm(e){const x=exById(e.exId);return x?x.name:(e.name||"Упражнение")}
function exInfo(e){const x=exById(e.exId);return x?{...x}:{id:e.exId,name:e.name||"Упражнение",muscle:e.muscle||"",equip:"",type:e.type||"wr"}}
function useCount(){const m=new Map();for(const w of S.workouts)for(const e of w.exercises)m.set(e.exId,(m.get(e.exId)||0)+1);return m}
function workSets(e){return e.sets.filter(s=>s.t!=="w")}
function exVolume(e){return(e.type||"wr")==="wr"?workSets(e).reduce((a,s)=>a+(s.w||0)*(s.r||0),0):0}
function wVolume(w){return w.exercises.reduce((a,e)=>a+exVolume(e),0)}
function wSets(w){return w.exercises.reduce((a,e)=>a+e.sets.length,0)}
function prevSets(exId,beforeStart){for(const w of S.workouts){if(beforeStart&&w.start>=beforeStart)continue;const e=w.exercises.find(x=>x.exId===exId);if(e)return e.sets}return null}
function setText(s,type){if(type==="time")return s.s?clock(s.s):"—";if(type==="bw")return s.r?(s.w?`+${fmtN(s.w)}×${s.r}`:`${s.r} повт.`):"—";return s.w!=null&&s.r?`${fmtN(s.w)}×${s.r}`:"—"}
function bestOf(sets,type){
  let b={w:0,e:0,r:0,s:0,vol:0};
  for(const s of sets){if(s.t==="w")continue;b.w=Math.max(b.w,s.w||0);b.e=Math.max(b.e,e1rm(s.w||0,s.r||0));b.r=Math.max(b.r,s.r||0);b.s=Math.max(b.s,s.s||0);b.vol=Math.max(b.vol,(s.w||0)*(s.r||0))}
  return b;
}
function records(w){ // PRs in workout w vs earlier workouts
  const out=[];
  for(const e of w.exercises){
    const type=e.type||"wr";const cur=bestOf(e.sets,type);let prev={w:0,e:0,r:0,s:0},had=false;
    for(const o of S.workouts){if(o.id===w.id||o.start>=w.start)continue;const oe=o.exercises.find(x=>x.exId===e.exId);if(!oe)continue;had=true;const b=bestOf(oe.sets,type);prev={w:Math.max(prev.w,b.w),e:Math.max(prev.e,b.e),r:Math.max(prev.r,b.r),s:Math.max(prev.s,b.s)}}
    if(!had)continue;
    if(type==="wr"){if(cur.w>prev.w)out.push({name:nm(e),what:"Вес "+fmtKg(cur.w)});else if(cur.e>prev.e+0.01)out.push({name:nm(e),what:"Расч. 1ПМ "+fmtKg(Math.round(cur.e))})}
    else if(type==="bw"&&cur.r>prev.r)out.push({name:nm(e),what:cur.r+" повт."});
    else if(type==="time"&&cur.s>prev.s)out.push({name:nm(e),what:clock(cur.s)});
  }
  return out;
}

const sheets=[];
function openSheet({title,left,right,body,onMount,cls}){
  const el=document.createElement("div");el.className="sheet "+(cls||"");el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");

function pop(html,bind){

let wakeLock=null,audio=null;
async function wake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){wakeLock=null}}

function beep(){try{if(!audio)return;[0,.22,.44].forEach((d,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=i===2?1175:880;o.connect(g);g.connect(audio.destination);const t=audio.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

function exCard(e,i){
  const type=e.type||"wr",prev=prevSets(e.exId,S.active.start)||[];
  let n=0;
  const rows=e.sets.map((s,j)=>{
    const lbl=s.t==="w"?"Р":s.t==="d"?"Д":s.t==="f"?"О":String(++n);
    const p=prev[j];const ptxt=p?setText(p,type):"—";
    const pw=p&&p.w!=null?fmtN(p.w):"",pr=p&&p.r?p.r:"",ps=p&&p.s?p.s:"";
    const inputs=type==="time"?`<td colspan="2"><input class="cell" style="max-width:120px" inputmode="numeric" data-f="s" data-i="${i}" data-j="${j}" value="${s.s??""}" placeholder="${ps||"сек"}" aria-label="Секунды"></td>`
      :(()=>{ // auto-filled values (from the last workout or copied from the set above) show as grey hints, not typed numbers
        const fw=v=>v!=null?fmtN(v).replace(/\s/g,""):"";
        const gw=!s.done&&s.auto&&s.auto.w&&s.w!=null,gr=!s.done&&s.auto&&s.auto.r&&s.r!=null;
        const phw=type==="bw"?(pw||"+0"):(pw||"0"),phr=pr||"0";
        return`<td><input class="cell" inputmode="decimal" data-f="w" data-i="${i}" data-j="${j}" data-ph="${phw}" value="${gw?"":fw(s.w)}" placeholder="${gw?fw(s.w):phw}" aria-label="Вес"></td><td><input class="cell" inputmode="numeric" data-f="r" data-i="${i}" data-j="${j}" data-ph="${phr}" value="${gr?"":(s.r??"")}" placeholder="${gr?s.r:phr}" aria-label="Повторения"></td>`})();
    return`<tr class="${s.done?"done":""}"><td><button class="setlbl t-${s.t||"n"}" data-act="set-menu" data-i="${i}" data-j="${j}" aria-label="Тип подхода">${lbl}</button></td><td class="prev">${p?`<button data-act="use-prev" data-i="${i}" data-j="${j}">${esc(ptxt)}</button>`:"—"}</td>${inputs}<td><button class="chk" data-act="set-done" data-i="${i}" data-j="${j}" aria-label="Подход выполнен" aria-pressed="${!!s.done}">${ICON.check}</button></td></tr>`;
  }).join("");
  const head=type==="time"?'<th>Подход</th><th>Прошлый</th><th colspan="2">Секунды</th><th></th>':`<th>Подход</th><th>Прошлый</th><th>${type==="bw"?"+кг":"кг"}</th><th>Повт.</th><th></th>`;
  return`<article class="ex" data-ex="${i}">
    <div class="ex-h"><button class="t" data-act="ex-info" data-id="${esc(e.exId)}"><b>${esc(nm(e))}</b><span>${esc(e.muscle||"")}</span></button><button class="iconbtn" data-act="ex-menu" data-i="${i}" aria-label="Действия с упражнением">${ICON.dots}</button></div>
    ${e.note!=null?`<textarea class="ex-note" data-note="${i}" rows="1" placeholder="Заметка: настройки тренажёра, ощущения…">${esc(e.note)}</textarea>`:""}
    <button class="chip-btn" data-act="ex-rest" data-i="${i}">${ICON.timer} Отдых: ${e.rest?fmtRest(e.rest):"выкл."}</button>
    <table class="sets"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
    <button class="addset" data-act="add-set" data-i="${i}">+ Подход</button>
  </article>`;
}

function exEntry(exId,setsN,restSec,info){
  const x=exById(exId)||(info&&info.name?{id:exId,name:info.name,muscle:info.muscle||"",type:info.type||"wr"}:{id:exId,name:"Упражнение",muscle:"",type:"wr"});
  const p=prevSets(exId);const n=setsN||(p?p.length:3);
  const tw=info&&info.w!=null?info.w:null,tr=info&&info.r!=null?info.r:null,plan=tw!=null||tr!=null;
  return{exId,name:x.name,muscle:x.muscle,type:x.type,rest:restSec??S.settings.rest,note:info&&info.note?info.note:null,sets:Array.from({length:n},(_,j)=>{
    // no plan targets: fill the set with what was done last time (same set number, or the last set)
    const pj=!plan&&p&&p.length?(p[j]||p[p.length-1]):null;
    const s={t:pj&&p[j]?(p[j].t||"n"):"n",w:null,r:null,s:null,done:false};
    if(plan){s.auto={};if(tw!=null){s.w=tw;s.auto.w=true}if(tr!=null){if(x.type==="time")s.s=tr;else{s.r=tr;s.auto.r=true}}}
    else if(pj){s.auto={};if(pj.w!=null){s.w=pj.w;s.auto.w=true}if(pj.r!=null){s.r=pj.r;s.auto.r=true}if(pj.s!=null)s.s=pj.s}
    return s})}}
function defaultName(){const h=new Date().getHours();return h<12?"Утренняя тренировка":h<17?"Дневная тренировка":"Вечерняя тренировка"}
function rerenderActive(){const y=scrollY;render();scrollTo(0,y)}

async function finishWorkout(){
  const a=S.active;
  const exercises=a.exercises.map(e=>({exId:e.exId,name:nm(e),muscle:e.muscle,type:e.type,note:e.note||"",sets:e.sets.filter(s=>s.done).map(s=>({t:s.t||"n",w:s.w??null,r:s.r??null,s:s.s??null}))})).filter(e=>e.sets.length);
  if(!exercises.length){if(await confirmBox("Нет выполненных подходов","Отметьте галочкой хотя бы один подход или отмените тренировку.","Отменить тренировку"))discardWorkout(true);return}
  const w={id:a.id,name:(a.name||"").trim()||defaultName(),start:a.start,end:Date.now(),routineId:a.routineId||null,exercises};
  const prs=records(w);const skipped=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>!s.done).length,0);
  pop(`<h3>Завершить тренировку?</h3>
    <div class="tiles"><div class="tile"><b>${fmtDur((w.end-w.start)/1000)}</b><span>время</span></div><div class="tile"><b>${fmtN(wVolume(w))}</b><span>объём, кг</span></div><div class="tile"><b>${wSets(w)}</b><span>подходов</span></div><div class="tile"><b>${prs.length}</b><span>${plural(prs.length,"рекорд","рекорда","рекордов")}</span></div></div>
    ${prs.length?`<div class="pr-list">${prs.map(p=>`<div><span class="tag pr">Рекорд</span><span>${esc(p.name)}: <b>${esc(p.what)}</b></span></div>`).join("")}</div>`:""}
    ${skipped?`<p class="small">Невыполненные подходы (${skipped}) не сохранятся.</p>`:""}
    ${!a.routineId?`<label class="row small" style="gap:8px"><input type="checkbox" id="save-routine"> Сохранить как программу</label>`:""}
    <button class="btn ok block" data-save>Сохранить тренировку</button><button class="btn block" data-close>Продолжить тренировку</button>`,(el,close)=>{
    $("[data-save]",el).onclick=async()=>{
      const asR=$("#save-routine",el)?.checked;close();
      S.active=null;rest=null;saveActive(true);wake(false);
      await put("workouts",w);
      if(asR)await put("routines",{id:newId(),name:w.name,created:Date.now(),items:w.exercises.map(e=>({exId:e.exId,sets:e.sets.length,rest:a.exercises.find(x=>x.exId===e.exId)?.rest??S.settings.rest}))});
      toast(prs.length?`Сохранено. Новых рекордов: ${prs.length}`:"Тренировка сохранена");S.tab="history";render();scrollTo(0,0);
    }});
}
async function discardWorkout(skipAsk){

function openPicker(onPick,multi=true){
  const sel=[];let q="",m="";
  const counts=useCount();
  const sh=openSheet({title:"Упражнения",left:'<button class="btn ghost sm" data-close>Отмена</button>',right:`<button class="btn primary sm" data-pick disabled>Добавить</button>`,
    body:`<input class="search" id="pick-q" type="search" placeholder="Поиск упражнения" autocomplete="off"><div class="chips" id="pick-m"></div><button class="btn block" data-newex>+ Создать своё упражнение</button><div id="pick-list"></div>`});
  const drawChips=()=>{$("#pick-m",sh.el).innerHTML=["",...MUSCLES].map(x=>`<button class="chip" data-m="${esc(x)}" aria-pressed="${m===x}">${esc(x||"Все")}</button>`).join("")};
  const draw=()=>{
    const ql=q.trim().toLowerCase();
    let list=allExercises().filter(e=>(!m||e.muscle===m)&&(!ql||e.name.toLowerCase().includes(ql)));
    list.sort((a,b)=>(counts.get(b.id)||0)-(counts.get(a.id)||0)||a.name.localeCompare(b.name,"ru"));
    $("#pick-list",sh.el).innerHTML=list.length?list.map(e=>`<button class="exrow ${sel.includes(e.id)?"sel":""}" data-id="${esc(e.id)}"><span class="ava">${sel.includes(e.id)?sel.indexOf(e.id)+1:esc(e.name[0])}</span><span class="t"><b>${esc(nm(e))}</b><span>${esc(e.muscle)} · ${esc(e.equip)}${counts.get(e.id)?` · ${counts.get(e.id)} раз`:""}</span></span>${e.builtin?"":'<span class="tag">своё</span>'}</button>`).join(""):'<p class="muted">Ничего не нашлось. Создайте своё упражнение.</p>';
    const pb=$("[data-pick]",sh.el);pb.disabled=!sel.length;pb.textContent=sel.length?`Добавить (${sel.length})`:"Добавить";
  };
  drawChips();draw();
  $("#pick-q",sh.el).addEventListener("input",ev=>{q=ev.target.value;draw()});
  sh.el.addEventListener("click",ev=>{
    const c=ev.target.closest("[data-m]");if(c){m=c.dataset.m;drawChips();draw();return}
    const r=ev.target.closest(".exrow");if(r){const id=r.dataset.id;if(!multi){sh.close();onPick([id]);return}const k=sel.indexOf(id);k>=0?sel.splice(k,1):sel.push(id);draw();return}

/* ---------- charts ---------- */
function lineChart(pts){
  if(pts.length<2)return'<p class="small muted" style="margin:0">График появится после второй тренировки с этим упражнением.</p>';
  const W=340,H=150,L=34,R=10,T=10,B=22;const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(lo===hi){lo-=1;hi+=1}const padv=(hi-lo)*.1;lo=Math.max(0,lo-padv);hi+=padv;
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const d=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=d+`L${x(pts.length-1).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const ticks=[lo,(lo+hi)/2,hi];const last=pts[pts.length-1];
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График прогресса">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${Math.round(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-4}">${esc(fmtDateShort(pts[0].t))}</text><text x="${W-R}" y="${H-4}" text-anchor="end">${esc(fmtDateShort(last.t))}</text></svg>`;
}
function barChart(vals,labels,fmt){
  const W=340,H=150,L=34,R=6,T=10,B=22;const hi=Math.max(1,...vals);const bw=(W-L-R)/vals.length;
  const y=v=>T+(H-T-B)*(1-v/hi);
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Диаграмма по неделям">
    ${(hi>=4?[0,hi/2,hi]:[0,hi]).map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${esc(fmt(t))}</text>`).join("")}
    ${vals.map((v,i)=>`<rect x="${(L+i*bw+bw*.18).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(0,H-B-y(v)).toFixed(1)}" rx="3" fill="${i===vals.length-1?"var(--accent)":"var(--muted)"}" fill-opacity="${i===vals.length-1?1:.45}"/>`).join("")}
    ${labels.map((l,i)=>l?`<text x="${(i===vals.length-1?W-R:L+i*bw+bw/2).toFixed(1)}" y="${H-5}" text-anchor="${i===vals.length-1?"end":"middle"}">${esc(l)}</text>`:"").join("")}</svg>`;
}

/* ---------- view: progress ---------- */
function viewProgress(){
  if(!S.workouts.length)return`<h1 class="display">Прогресс</h1><div class="empty"><b>Пока нечего показать</b><p>Здесь будут тренировки по неделям, объём, время в зале, нагрузка по мышцам и календарь.</p><button class="btn primary" data-tab="workout">Начать тренировку</button></div>`;
  const now=Date.now(),d30=now-30*864e5,recent=S.workouts.filter(w=>w.start>=d30);
  const N=12,ws=weekStart(now),weeks=Array.from({length:N},(_,i)=>ws-(N-1-i)*7*864e5);
  const per=weeks.map(s=>S.workouts.filter(w=>w.start>=s&&w.start<s+7*864e5));
  const metric=S.progMetric;
  const vals=per.map(list=>metric==="count"?list.length:metric==="vol"?list.reduce((a,w)=>a+wVolume(w),0):list.reduce((a,w)=>a+(w.end-w.start)/3600e3,0));
  const fmt=metric==="count"?v=>String(Math.round(v)):metric==="vol"?v=>v>=1000?Math.round(v/1000)+"т":String(Math.round(v)):v=>(Math.round(v*10)/10)+"ч";
  const labels=weeks.map((s,i)=>(N-1-i)%4===0?fmtDateShort(s).replace(".",""):"");
  const musc=new Map();for(const w of recent)for(const e of w.exercises)if(e.muscle)musc.set(e.muscle,(musc.get(e.muscle)||0)+workSets(e).length);
  const mlist=[...musc.entries()].sort((a,b)=>b[1]-a[1]),mmax=Math.max(1,...mlist.map(m=>m[1]));
  // heatmap: last 16 weeks Mon..Sun
  const hw=16,hs=ws-(hw-1)*7*864e5,daysOn=new Set(S.workouts.map(w=>dayStart(w.start)));const today=dayStart(now);
  let heat="";for(let i=0;i<hw*7;i++){const t=dayStart(hs+i*864e5+3600e3);heat+=`<i class="${t>today?"fut":daysOn.has(t)?"on":""}" title="${esc(fmtDateShort(t))}"></i>`}
  // streak in weeks
  let streak=0;for(let i=N-1;i>=0;i--){if(per[i].length)streak++;else if(i===N-1)continue;else break}
  // top lifts
  const best=new Map();for(const w of S.workouts)for(const e of w.exercises)if((e.type||"wr")==="wr"){const b=bestOf(e.sets);const cur=best.get(e.exId);if(!cur||b.w>cur.w)best.set(e.exId,{name:nm(e),w:b.w,t:w.start,id:e.exId})}
  const lifts=[...best.values()].filter(b=>b.w>0).sort((a,b)=>b.w-a.w).slice(0,8);
  return`<h1 class="display">Прогресс</h1>
  <div class="tiles"><div class="tile"><b>${S.workouts.length}</b><span>тренировок всего</span></div><div class="tile"><b>${streak}</b><span>${plural(streak,"неделя","недели","недель")} подряд</span></div><div class="tile"><b>${recent.length}</b><span>за 30 дней</span></div><div class="tile"><b>${fmtDur(recent.reduce((a,w)=>a+(w.end-w.start)/1000,0))}</b><span>в зале за 30 дней</span></div></div>
  <section class="card list"><div class="row between"><h2>По неделям</h2></div>
    <div class="chips">${[["count","Тренировки"],["vol","Объём"],["time","Время"]].map(([k,l])=>`<button class="chip" data-act="prog-metric" data-m="${k}" aria-pressed="${metric===k}">${l}</button>`).join("")}</div>
    ${barChart(vals,labels,fmt)}</section>
  <section class="card list"><h2>Подходы по мышцам</h2><div class="small muted">Рабочие подходы за 30 дней</div>
    ${mlist.length?mlist.map(([m,c])=>`<div class="hbar"><span>${esc(m)}</span><div class="tr"><i style="width:${(100*c/mmax).toFixed(1)}%"></i></div><em>${c}</em></div>`).join(""):'<p class="small muted">За 30 дней тренировок не было.</p>'}</section>
  <section class="card list"><h2>Календарь</h2><div class="small muted">Последние 16 недель, по строкам — Пн…Вс</div><div class="heat">${heat}</div></section>
  ${lifts.length?`<section class="card list"><h2>Лучшие веса</h2>${lifts.map(l=>`<button class="exrow" data-act="ex-info" data-id="${esc(l.id)}"><span class="t"><b>${esc(l.name)}</b><span>${esc(fmtDate(l.t))}</span></span><b class="num">${fmtKg(l.w)}</b></button>`).join("")}</section>`:""}`;
}

    if(t.hasAttribute("data-login")||t.hasAttribute("data-signup")){
      const c=creds();if(!c.email||c.password.length<6){msg("Введите почту и пароль не короче 6 символов.");return}

    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="podhod-"+new Date().toISOString().slice(0,10)+".json";

    for(const r of d.routines||[])if(r&&r.id&&Array.isArray(r.items))await put("routines",r);

  };

    if(!(await confirmBox("Удалить все данные?","Тренировки, программы и свои упражнения будут удалены безвозвратно"+(session?" — и на этом устройстве, и в облаке":"")+". Сначала скачайте копию.","Удалить всё")))return;
    for(const w of S.workouts.slice())await del("workouts",w.id);for(const r of S.routines.slice())await del("routines",r.id);for(const c of S.custom.slice())await del("custom",c.id);
    S.active=null;saveActive(true);sh.close();toast("Все данные удалены");render();
  };
}

      {label:"Удалить подход",danger:true,act:()=>{e.sets.splice(j,1);saveActive();rerenderActive()}}]);break}
    case"ex-menu":{const e=a.exercises[i];menu(nm(e),[
      {label:e.note!=null?"Убрать заметку":"Добавить заметку",act:()=>{e.note=e.note!=null?null:"";saveActive();rerenderActive();if(e.note==="")setTimeout(()=>$(`[data-note="${i}"]`)?.focus(),30)}},
      {label:"Переименовать упражнение",act:()=>renameExercise(e.exId)},
      {label:"Заменить упражнение",act:()=>openPicker(ids=>{const x=exById(ids[0]);Object.assign(e,{exId:x.id,name:x.name,muscle:x.muscle,type:x.type});saveActive();rerenderActive()},false)},
      ...(i>0?[{label:"Переместить выше",act:()=>{[a.exercises[i-1],a.exercises[i]]=[a.exercises[i],a.exercises[i-1]];saveActive();rerenderActive()}}]:[]),
      ...(i<a.exercises.length-1?[{label:"Переместить ниже",act:()=>{[a.exercises[i+1],a.exercises[i]]=[a.exercises[i],a.exercises[i+1]];saveActive();rerenderActive()}}]:[]),
      {label:"Удалить упражнение",danger:true,act:()=>{a.exercises.splice(i,1);saveActive();rerenderActive()}}]);break}
    case"ex-rest":{const e=a.exercises[i];menu("Отдых: "+nm(e),[0,30,60,90,120,150,180,240].map(sv=>({label:(sv?fmtRest(sv):"Выключить")+(sv===e.rest?"  ✓":""),act:()=>{e.rest=sv;saveActive();rerenderActive()}})));break}
    case"rest-adj":restAdj(+b.dataset.d);break;
    case"rest-skip":rest=null;renderFloat();break;
    case"ex-info":openExInfo(b.dataset.id);break;
    case"new-ex":openExerciseForm(null);break;
    case"ex-m":S.exFilter.m=b.dataset.m;render();break;
    case"open-workout":openWorkout(b.dataset.id);break;
    case"prog-metric":S.progMetric=b.dataset.m;render();break;
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="ex-q"){S.exFilter.q=t.value;renderExList();return}
  if(!S.active)return;
  if(t.id==="aw-name"){S.active.name=t.value;saveActive();return}
  if(t.dataset.note!=null){S.active.exercises[+t.dataset.note].note=t.value;saveActive();return}
  if(t.dataset.f){
    const i=+t.dataset.i,j=+t.dataset.j,f=t.dataset.f,e=S.active.exercises[i],s=e.sets[j];
    const v=num(t.value),val=f==="w"?v:(v==null?null:Math.round(v));
    s[f]=val;if(s.auto)delete s.auto[f]; // typed by hand: no longer auto-filled
    // copy the value down to the following sets of the same kind (warm-up -> warm-up, working -> working)
    // that are not done yet and are either empty or were filled this way before
    const warm=s.t==="w";
    for(let k=j+1;k<e.sets.length;k++){
      const o=e.sets[k];if(o.done||(o.t==="w")!==warm)continue;
      if(o[f]==null||(o.auto&&o.auto[f])){
        o[f]=val;o.auto={...(o.auto||{})};if(val==null)delete o.auto[f];else o.auto[f]=true;
        const el=document.querySelector(`input[data-f="${f}"][data-i="${i}"][data-j="${k}"]`);
        if(el){el.value="";el.placeholder=val==null?(el.dataset.ph||""):(f==="w"?fmtN(val).replace(/\s/g,""):String(val))}
      }
    }
    saveActive();updateActiveStats()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){const p=document.querySelector(".pop");if(p){p.click();return}const s=sheets[sheets.length-1];if(s)$("[data-close]",s)?.click()}});
init();
</script>
</body>
